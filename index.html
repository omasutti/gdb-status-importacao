<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="30">
<title>GDB — Status de Importação</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;}
body{background:#EBF0F8;margin:0;}

.card-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1rem;
  padding:1rem 1.1rem;
}
@media(max-width:1380px){.card-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:960px) {.card-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:580px) {.card-grid{grid-template-columns:1fr;}}

/* ── Card base ─────────────────────────────── */
.card{
  background:#fff;
  border:1.5px solid #C8D5E6;
  border-radius:12px;
  box-shadow:0 1px 4px rgba(11,37,69,.07);
  cursor:pointer;
  transition:box-shadow .2s,transform .15s;
  display:flex;flex-direction:column;
}
.card:hover{box-shadow:0 8px 28px rgba(11,37,69,.14);transform:translateY(-2px);}

/* ── Delayed card: red top stripe ──────────── */
.card-delayed{border-top:3px solid #DC2626!important;}

/* ── Date row ──────────────────────────────── */
.dates-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  text-align:center;
  background:#F3F7FC;border-radius:8px;
  padding:9px 2px;margin:11px 0 0;
}
.date-col{padding:0 4px;}
.date-col+.date-col{border-left:1px solid #DDE6F0;}
.date-lbl{font-size:.6rem;color:#94A3B8;font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1.2;}
.date-val{font-size:.8rem;color:#1A2942;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;}

/* ── Delayed date cell ─────────────────────── */
.date-col-alert{
  background:#FEF2F2;border:1.5px solid #FECACA;
  border-radius:7px;padding:5px 6px;margin:-5px -3px;
}
.date-col-alert .date-lbl{color:#DC2626;}
.date-col-alert .date-val{color:#B91C1C;font-weight:800;font-size:.82rem;}
.overdue-chip{
  display:inline-block;background:#DC2626;color:#fff;
  font-size:.56rem;font-weight:700;letter-spacing:.07em;
  padding:1px 6px;border-radius:3px;margin-top:3px;
  text-transform:uppercase;
}

/* ── Progress ──────────────────────────────── */
.progress-track{height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden;margin:10px 0 3px;}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#0B2545 0%,#1869B7 60%,#4EA8E0 100%);transition:width .6s ease;}

/* ── Modal ─────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;
  backdrop-filter:blur(3px);
}
.modal-box{
  background:#fff;border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.3);
  width:92%;max-width:620px;max-height:84vh;
  overflow-y:auto;padding:2rem;
}
.badge{
  display:inline-block;padding:3px 10px;
  border-radius:20px;font-size:.68rem;font-weight:700;
  letter-spacing:.03em;white-space:nowrap;
}
.acc-table th{background:#EBF5FB;color:#003366;font-weight:700;font-size:.78rem;padding:6px 12px;text-align:left;}
.acc-table td{font-size:.82rem;color:#2D3748;padding:5px 12px;border-bottom:1px solid #EDF2F7;}
.acc-table tr:nth-child(even) td{background:#F7FAFC;}
.dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block;
  animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
</style>
</head>

<div class="card-grid" id="grid"></div>

<!-- MODAL DE ACESSÓRIOS -->
<div id="modal" class="modal-overlay" style="display:none;" onclick="fecharModal(event)">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;">
      <div>
        <h2 id="m-titulo" style="font-size:1.15rem;font-weight:800;color:#1A202C;"></h2>
        <p id="m-sub" style="font-size:.82rem;color:#718096;margin-top:3px;"></p>
      </div>
      <button onclick="document.getElementById('modal').style.display='none'"

    </div>
    <div id="m-body"></div>
  </div>
</div>

function logBlock(c) {
  const fs = [
    ['Porto de Origem',      c.porto_origem],
    ['Situação do Trajeto',  c.status_trajeto],
    ['Navio',                c.navio],
    ['Prev. Chegada Porto',  c.previsao_porto],
    ['Porto de Destino',     c.porto_destino],
  ].filter(([,v]) => v && v.trim());
  if (!fs.length) return '';
  return '<div style="display:grid;grid-template-columns:auto 1fr;gap:2px 10px;' +
    'font-size:.71rem;margin-top:10px;padding:7px 10px;' +
    'background:#F3F7FC;border-radius:7px;border:1px solid #DDE6F0;">' +
    fs.map(([k,v]) =>
      '<span style="color:#94A3B8;font-weight:700;white-space:nowrap;">'+k+'</span>' +
      '<span style="color:#374151;font-weight:500;">'+v+'</span>'
    ).join('') + '</div>';
}

function render() {
  const grid  = document.getElementById('grid');
  const vazio = document.getElementById('vazio');
  const stats = document.getElementById('stats');
  grid.innerHTML = '';

  if (!CARDS.length) {
    vazio.style.display = 'flex';
    document.getElementById('total').textContent = '0 pedidos ativos';
    return;
  }
  vazio.style.display = 'none';

  const n = CARDS.length;
  document.getElementById('total').textContent =
    n + ' pedido' + (n > 1 ? 's' : '') + ' ativo' + (n > 1 ? 's' : '');

  // Stats bar
  const cnt = {};
  CARDS.forEach(c => { cnt[c.status] = (cnt[c.status]||0)+1; });
  stats.innerHTML = Object.entries(cnt).map(([s,n]) => {
    const [bg,fg] = SC[s] || ['#EEE','#333'];
    return '<div style="display:flex;align-items:center;gap:6px;white-space:nowrap;">' +
      '<span class="badge" style="background:'+bg+';color:'+fg+';">'+s+'</span>' +
      '<span style="font-weight:700;color:#374151;font-size:.88rem;">'+n+'</span></div>';
  }).join('<div style="width:1px;background:#E2E8F0;height:20px;flex-shrink:0;"></div>');

  CARDS.forEach((c, idx) => {
    const [bgS,fgS] = SC[c.status] || ['#EEE','#333'];

    // Estimada cell — normal vs atrasado
    const estimadaCell = c.alerta_data
      ? '<div class="date-col">' +
          '<div class="date-col-alert">' +
            '<p class="date-lbl">⚠ Estimada</p>' +
            '<p class="date-val">'+(c.data_estimada||'—')+'</p>' +
            '<span class="overdue-chip">atrasado</span>' +
          '</div>' +
        '</div>'
      : '<div class="date-col">' +
          '<p class="date-lbl">Estimada</p>' +
          '<p class="date-val">'+(c.data_estimada||'—')+'</p>' +
        '</div>';

    const obs = c.observacoes
      ? '<p style="font-size:.7rem;color:#94A3B8;font-style:italic;margin-top:8px;' +
        'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="'+c.observacoes+'">' +
        c.observacoes+'</p>'
      : '';

    const accLbl = c.acessorios && c.acessorios.length
      ? '<span style="font-size:.68rem;color:#1869B7;font-weight:700;">'+
        c.acessorios.length+' itens →</span>'
      : '';

    const div = document.createElement('div');
    div.className = 'card' + (c.alerta_data ? ' card-delayed' : '');
    div.onclick   = () => abrirModal(idx);
    div.innerHTML =
      '<div style="padding:14px 15px 13px;display:flex;flex-direction:column;height:100%;">' +

        // Cabeçalho
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
          '<div style="min-width:0;">' +
            '<p style="font-weight:800;color:#0B2545;font-size:.9rem;line-height:1.25;' +
               'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+c.cliente+'">'+c.cliente+'</p>' +
            '<p style="font-size:.77rem;color:#1869B7;font-weight:600;margin-top:2px;' +
               'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+c.modelo+'</p>' +
            '<p style="font-size:.68rem;color:#A0AEC0;font-family:monospace;margin-top:2px;letter-spacing:.01em;">#'+c.matricula+'</p>' +
          '</div>' +
          '<span class="badge" style="background:'+bgS+';color:'+fgS+';flex-shrink:0;margin-top:1px;">'+c.status+'</span>' +
        '</div>' +

        // Datas
        '<div class="dates-row">' +
          '<div class="date-col">' +
            '<p class="date-lbl">Pedido</p>' +
            '<p class="date-val">'+(c.data_pedido||'—')+'</p>' +
          '</div>' +
          '<div class="date-col">' +
            '<p class="date-lbl">Original</p>' +
            '<p class="date-val">'+(c.data_original||'—')+'</p>' +
          '</div>' +
          estimadaCell +
        '</div>' +

        // Logística + obs
        logBlock(c) +
        obs +

        // Progresso (pinned to bottom)
        '<div style="margin-top:auto;padding-top:8px;">' +
          '<div class="progress-track">' +
            '<div class="progress-fill" style="width:'+c.progresso+'%;"></div>' +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<span style="font-size:.67rem;color:#94A3B8;font-variant-numeric:tabular-nums;">'+c.progresso+'% concluído</span>' +
            accLbl +
          '</div>' +
        '</div>' +

      '</div>';

    grid.appendChild(div);
  });
}

function abrirModal(idx) {
  const c = CARDS[idx];
  document.getElementById('m-titulo').textContent = c.cliente;
  document.getElementById('m-sub').textContent    = c.modelo + '  ·  #' + c.matricula;

  let html = '';
  if (c.acessorios && c.acessorios.length) {
    html = '<p style="font-weight:700;color:#2D3748;font-size:.88rem;margin-bottom:10px;">' +
      'Acessórios Selecionados (' + c.acessorios.length + ')</p>' +
      '<table class="acc-table" style="width:100%;border-collapse:collapse;border-radius:8px;overflow:hidden;">' +
      '<thead><tr>' +
        '<th>Acessório</th>' +
        '<th>Especificação / Detalhe</th>' +
      '</tr></thead><tbody>' +
      c.acessorios.map(a =>
        '<tr><td>'+a.nome+'</td><td style="color:#718096;">'+(a.desc||'—')+'</td></tr>'
      ).join('') +
      '</tbody></table>';
  } else {
    html = '<p style="text-align:center;color:#94A3B8;padding:40px 0;font-size:.9rem;">' +
      'Nenhum acessório registrado neste pedido.</p>';
  }

  document.getElementById('m-body').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}

function fecharModal(e) {
  if (e.target.id === 'modal') document.getElementById('modal').style.display = 'none';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal').style.display = 'none';
});

render();
</script>
</body>
</html>
